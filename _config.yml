# Site settings
title: Wenbo Chen
tagline: "LLM Post-Training & Evaluation for AI Agents"
description: "Wenbo Chen is an Applied Scientist at Amazon working on LLM post-training for the Amazon Ads agent, and a researcher in LLM and agent evaluation (SkillsBench, NeurIPS 2026; ClawsBench, COLM 2026), reinforcement learning, and test-time scaling. ML PhD, Georgia Tech."
url: https://wenbo11.github.io
baseurl: ""

# Author
author:
  name: Wenbo Chen
  title: Applied Scientist
  affiliation: Amazon
  email: wenbochen111@outlook.com
  google_scholar: https://scholar.google.com/citations?hl=en&user=T8XT0OAAAAAJ
  github: Wenbo11
  linkedin: wenbo-chen
  twitter: wenbochen8

# SEO / social cards (jekyll-seo-tag)
image: /assets/img/profile.jpg
twitter:
  username: wenbochen8
  card: summary
social:
  name: Wenbo Chen
  links:
    - https://scholar.google.com/citations?hl=en&user=T8XT0OAAAAAJ
    - https://github.com/Wenbo11
    - https://www.linkedin.com/in/wenbo-chen
    - https://twitter.com/wenbochen8

# Analytics / visitor counter (GoatCounter)
# Sign up free at https://www.goatcounter.com/, then put your code here.
# e.g. if your dashboard is wenbochen.goatcounter.com, set: goatcounter: wenbochen
goatcounter: "wenbochen"

# Build
markdown: kramdown
kramdown:
  input: GFM
highlighter: rouge

# Collections
collections:
  news:
    output: false

# Sass
sass:
  sass_dir: _sass
  style: compressed

# Include
include:
  - _pages

# Exclude
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - vendor

# Defaults
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: default

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
