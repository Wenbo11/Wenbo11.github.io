# Site settings
title: Wenbo Chen
description: "Applied Scientist at Amazon | AI Agents & Data-Driven Decision Making"
url: https://wenbo11.github.io
baseurl: ""

# Author
author:
  name: Wenbo Chen
  title: Applied Scientist
  affiliation: Amazon
  email: wenbochen11@gmail.com
  google_scholar: https://scholar.google.com/citations?hl=en&user=T8XT0OAAAAAJ
  github: Wenbo11
  linkedin: wenbo-chen
  twitter: wenbochen8

# Build
markdown: kramdown
kramdown:
  input: GFM
highlighter: rouge

# Collections
collections:
  news:
    output: false

# Sass
sass:
  sass_dir: _sass
  style: compressed

# Include
include:
  - _pages

# Exclude
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - vendor

# Defaults
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: default

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
