<footer class="site-footer">
  <div class="footer-inner">
    <p>
      &copy; {{ 'now' | date: "%Y" }} {{ site.author.name }}. Powered by <a href="https://jekyllrb.com/">Jekyll</a>.
      {%- if site.goatcounter and site.goatcounter != "" %}
      <span class="visitor-count">&middot; <span id="visitor-count" aria-live="polite"></span></span>
      {%- endif %}
    </p>
  </div>
</footer>

<dialog class="figure-lightbox" id="figure-lightbox" aria-label="Figure preview">
  <img alt="">
  <p></p>
</dialog>
<script>
  // Click (or Enter/Space on) a publication thumbnail to view the figure full size.
  (function () {
    var box = document.getElementById('figure-lightbox');
    var thumbs = document.querySelectorAll('.pub-thumb');
    if (!box || !box.showModal || !thumbs.length) return;
    var img = box.querySelector('img');
    var caption = box.querySelector('p');
    function open(t) {
      img.src = t.currentSrc || t.src;
      img.alt = t.alt;
      caption.textContent = t.alt;
      box.showModal();
    }
    thumbs.forEach(function (t) {
      t.tabIndex = 0;
      t.setAttribute('role', 'button');
      t.title = 'Click to enlarge';
      t.addEventListener('click', function () { open(t); });
      t.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(t); }
      });
    });
    box.addEventListener('click', function () { box.close(); });
  })();
</script>

{%- if site.goatcounter and site.goatcounter != "" %}
<script>
  // Fetch the total pageview count from GoatCounter and show it in the footer.
  (function () {
    var el = document.getElementById('visitor-count');
    if (!el) return;
    fetch('https://{{ site.goatcounter }}.goatcounter.com/counter/TOTAL.json')
      .then(function (r) { return r.json(); })
      .then(function (d) { el.textContent = d.count + ' visitors'; })
      .catch(function () { /* stay silent if the endpoint is unreachable */ });
  })();
</script>
<script data-goatcounter="https://{{ site.goatcounter }}.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
{%- endif %}
